version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
        - mkdir -p site
        - cp -r *.html *.css *.js assest site/
        - cp sitemap.xml robots.txt site/
        - cp -r dist site/dist
        - cp -r real-estate site/real-estate
        - cp -r ecommerce site/ecommerce
        - cp -r saloon site/saloon
        - cp -r eye-vision site/eye-vision
        - cp -r brewery site/brewery
        - cp -r school site/school
  artifacts:
    baseDirectory: site
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
